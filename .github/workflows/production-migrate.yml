name: Production Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate-production-database:
    name: Migrate production database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Require the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo 'A newer main revision exists; migrate that revision instead.'
            exit 1
          fi
      - name: Validate production settings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          test -n "$DATABASE_AUTH_TOKEN"
          case "$DATABASE_URL" in libsql://*) ;; *) echo 'Production DATABASE_URL must be a Turso libsql:// URL'; exit 1 ;; esac
      - name: Check for pending production migrations
        id: pending-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:migrate:pending
      - name: Backup production database
        if: steps.pending-migrations.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:backup
      - name: Upload backup artifact
        if: steps.pending-migrations.outputs.has_pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/backups/*.db
          if-no-files-found: error
          retention-days: 14
      - name: Run production migrations
        if: steps.pending-migrations.outputs.has_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:migrate
      - name: Skip backup and migrate when schema is current
        if: steps.pending-migrations.outputs.has_pending != 'true'
        run: echo 'Production database is already up to date.'
